<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="text-center container fs-5">
        <label for="fieldText" class="form-label m-5 f">My ToDos</label>
        <div class="input-group d-flex align-items-stretch gap-2">
            <button type="button" class="btn-outline theme-inverse text-nowrap">Search</button>
            <input type="text" class="form-control" placeholder="Search...">
        </div>

        <div class="form-field m-5">
            <input type="text" class="form-control fs-5" id="topic" placeholder="Topic">
            <input type="text" class="form-control fs-5" id="description" placeholder="Description">
        </div>
        
        <div class="buttonGroup">
            <button type="button" class="btn-outline theme-success m-3">Done</button>
            <button type="button" class="btn-outline theme-warning m-3">Edit</button>
            <button type="button" class="btn-outline theme-danger m-3">Delete</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
