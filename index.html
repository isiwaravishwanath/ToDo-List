<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body>
    <div class="div container text-center col-6">
        <div class="card mt-5 bg-muted-info fs-muted-info">
            <div class="card-body text-xl fw-bold">
                <p>My ToDo's</p>
            </div>
        </div>

        <div class="form-field mt-3 d-flex">
            <input type="Text" class="form-control" id="fieldText" placeholder="Search your ToDo">
            <button type="button" class="btn-outline theme-primary" onclick="searchBtn()">Search</button>
            <button type="button" class="btn-outline theme-success" onclick="addBtn()">Add</button>
        </div>

        <div class="card">
            <div class="form-field">
                <input type="checkbox" id="checkLabel" class="check" />
                <label for="checkLabel">Example new checkbox</label>
            </div>
            <div class="card-body">
                This is some text within a card body.
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>

</html>
