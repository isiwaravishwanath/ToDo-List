<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body>
    <div class="div container text-center col-6">
        <div class="card mt-5 bg-secondary fs-muted-info">
            <div class="card-body text-xl fw-bold">
                <p>My ToDo's</p>
            </div>
        </div>

        <div class="form-field mt-3 d-flex">
            <input type="Text" class="form-control" id="searchFld" placeholder="Search your ToDo">
            <button type="button" class="btn-outline theme-primary" onclick="searchBtn()">Search</button>
            <button type="button" class="btn-outline theme-success" data-bs-toggle="dialog"
                data-bs-target="#exampleDialog">Add</button>
        </div>

        <div class="d-flex mt-3 align-items-center" id="toDos">
            
        </div>

        <!-- ToDo Adding -->
        <dialog class="dialog" id="exampleDialog" aria-labelledby="exampleDialogLabel">
            <div class="dialog-header">
                <h1 class="dialog-title" id="exampleDialogLabel">Add your new ToDo</h1>
                <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
            </div>
            <div class="dialog-body">
            <input type="Text" class="form-control" id="titleFld" placeholder="Title">
            <input type="Text" class="form-control mt-2" id="descriptionFld" placeholder="Description">
            </div>
            <div class="dialog-footer">
                <button type="button" class="btn-outline theme-secondary" data-bs-dismiss="dialog">Close</button>
                <button type="button" class="btn-outline theme-success" data-bs-dismiss="dialog" onclick="addBtn()">Add</button>
            </div>
        </dialog>

    </div>

    <script src="app.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-+PW0IDVGGwmpaBQvcXY+W0BcpHpITFB3dSfSoGvDdHtLbrLpSbpGcvtQRM/BJpz+"
        crossorigin="anonymous"></script>
</body>

</html>
